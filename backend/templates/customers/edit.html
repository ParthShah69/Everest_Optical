{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0">Edit Customer: {{ customer.name }}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="name" class="form-label">Customer Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ customer.name }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="care_of" class="form-label">Care Of (Father/Husband Name)</label>
                            <input type="text" class="form-control" id="care_of" name="care_of" value="{{ customer.care_of or '' }}">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="phone" class="form-label">Phone Number <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="phone" name="phone" value="{{ customer.phone }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ customer.email or '' }}">
                        </div>
                    </div>

                    <h6 class="border-bottom pb-2 mt-3 mb-3"><i class="fas fa-map-marker-alt me-1"></i> Address</h6>
                    <div class="mb-3">
                        <label for="address" class="form-label">Street Address</label>
                        <textarea class="form-control" id="address" name="address" rows="2">{{ customer.address or '' }}</textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="city" class="form-label">City</label>
                            <input type="text" class="form-control" id="city" name="city" value="{{ customer.city or '' }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="state" class="form-label">State</label>
                            <input type="text" class="form-control" id="state" name="state" value="{{ customer.state or '' }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="pincode" class="form-label">Pincode</label>
                            <input type="text" class="form-control" id="pincode" name="pincode" value="{{ customer.pincode or '' }}">
                        </div>
                    </div>

                    <h6 class="border-bottom pb-2 mt-3 mb-3"><i class="fas fa-credit-card me-1"></i> Financial</h6>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="credit_limit" class="form-label">Credit Limit (₹)</label>
                            <input type="number" class="form-control" id="credit_limit" name="credit_limit" value="{{ customer.credit_limit or 0 }}" min="0" step="0.01">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Loyalty Points</label>
                            <input type="text" class="form-control" value="{{ customer.loyalty_points or 0 }}" disabled>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mt-3">
                        <a href="{{ url_for('customer.index') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-warning">Update Customer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
