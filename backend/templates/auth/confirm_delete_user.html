{% extends "base.html" %}

{% block content %}
<div class="card border-danger shadow-sm mx-auto mt-4" style="max-width: 36rem;">
    <div class="card-header bg-danger text-white">
        <h1 class="h5 mb-0"><i class="fas fa-user-times me-2"></i>Delete user</h1>
    </div>
    <div class="card-body">
        <p>Review this account before deleting it:</p>
        <dl class="row mb-3">
            <dt class="col-sm-3">Username</dt><dd class="col-sm-9">{{ user.username }}</dd>
            <dt class="col-sm-3">Email</dt><dd class="col-sm-9">{{ user.email or 'Not set' }}</dd>
            <dt class="col-sm-3">Role</dt><dd class="col-sm-9">{{ user.role }}</dd>
        </dl>
        <p class="text-danger fw-semibold">Deleting this user cannot be undone.</p>
        <form action="{{ url_for('auth.delete_user', id=user.id) }}" method="POST" class="d-flex gap-2">
            <input type="hidden" name="delete_token" value="{{ delete_token }}">
            <a href="{{ url_for('auth.manage_users') }}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-danger">Approve deletion</button>
        </form>
    </div>
</div>
{% endblock %}
